name: Deploy real estate analyzer
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update regional conversion rates
        env:
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
        run: python scripts/update-rates.py
      - name: Rebuild standalone HTML
        run: node build-offline.mjs
      - name: Verify analysis rules
        run: node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
